name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BiStudent.slnx
      - run: dotnet build BiStudent.slnx -c Release --no-restore -warnaserror
      - run: dotnet test --solution BiStudent.slnx -c Release --no-build
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Registration site tests
        run: node --test tests/site/register.test.cjs
      - name: Desktop self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem BiStudent/bin/Release -Recurse -Filter BiStudent.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          $result = Join-Path $exe.DirectoryName 'diagnostics/result.txt'
          if ($p.ExitCode -ne 0 -or (Get-Content $result) -ne 'OK') { Get-Content (Join-Path $exe.DirectoryName 'self-test-error.txt') -ErrorAction SilentlyContinue; exit 1 }

  firebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Firebase Emulator tests
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: >
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-bistudent
          "dotnet test BiStudent.Tests -- --filter-class BiStudent.Tests.FirebaseEmulatorTests --filter-class BiStudent.Tests.FirebaseSyncScenarioTests --filter-class BiStudent.Tests.FirebaseDeferredSignInTests"

  docker:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f BiStudent.Server/Dockerfile -t bistudent-server .
      - name: Smoke test
        run: |
          docker run -d --name bistudent -p 5080:8080 bistudent-server
          for i in $(seq 1 30); do curl -fsS http://localhost:5080/health && exit 0; sleep 2; done
          docker logs bistudent
          exit 1

  publish:
    runs-on: windows-2025
    needs: build-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      VERSION: 1.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore local tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .config | Out-Null
          Copy-Item dotnet-tools.json .config/dotnet-tools.json
          dotnet tool restore
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v5
        with:
          name: BiStudent-win-x64
          path: dist/BiStudent-win-x64.zip
      - name: Download previous release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN -o releases
      - name: Pack Velopack release
        shell: pwsh
        run: dotnet vpk pack --packId BiStudent.Desktop --packTitle BiStudent --packVersion $env:VERSION --packDir out/BiStudent --mainExe BiStudent.exe --runtime win-x64 -o releases
      - name: Upload Velopack release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN -o releases --publish --releaseName "BiStudent $env:VERSION" --tag "v$env:VERSION" --targetCommitish "${{ github.sha }}" --merge
      - name: Release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v$env:VERSION" --notes "Windows 10/11 x64: установите программу через BiStudent.Desktop-win-Setup.exe или распакуйте переносную версию BiStudent.Desktop-win-Portable.zip. Дальше программа обновляется сама. Войдите логином и паролем, которые выдал администратор; при первом входе нужен интернет — данные загрузятся из облака."
