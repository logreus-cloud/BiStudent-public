name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BiStudent.slnx
      - run: dotnet build BiStudent.slnx -c Release --no-restore -warnaserror
      - run: dotnet test --solution BiStudent.slnx -c Release --no-build
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Registration site tests
        run: node --test tests/site/register.test.cjs
      - name: Desktop self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem BiStudent/bin/Release -Recurse -Filter BiStudent.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          $result = Join-Path $exe.DirectoryName 'diagnostics/result.txt'
          if ($p.ExitCode -ne 0 -or (Get-Content $result) -ne 'OK') { Get-Content (Join-Path $exe.DirectoryName 'self-test-error.txt') -ErrorAction SilentlyContinue; exit 1 }

  firebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Firebase Emulator tests
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: >
          npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-bistudent
          "dotnet test BiStudent.Tests -- --filter-class BiStudent.Tests.FirebaseEmulatorTests --filter-class BiStudent.Tests.FirebaseSyncScenarioTests"

  docker:
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f BiStudent.Server/Dockerfile -t bistudent-server .
      - name: Smoke test
        run: |
          docker run -d --name bistudent -p 5080:8080 bistudent-server
          for i in $(seq 1 30); do curl -fsS http://localhost:5080/health && exit 0; sleep 2; done
          docker logs bistudent
          exit 1

  publish:
    runs-on: windows-2025
    needs: build-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: BiStudent-win-x64
          path: dist/BiStudent-win-x64.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v1.2.${{ github.run_number }}" dist/BiStudent-win-x64.zip
          --target "${{ github.sha }}" --title "BiStudent 1.2.${{ github.run_number }}"
          --notes "Windows 10/11 x64: скачайте BiStudent-win-x64.zip, распакуйте целиком и запустите BiStudent.exe. Устанавливать ничего не нужно. Войдите логином и паролем, которые выдал администратор; при первом входе нужен интернет — данные загрузятся из облака."
